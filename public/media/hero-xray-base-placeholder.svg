<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="base-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010d1c" />
      <stop offset="45%" stop-color="#021528" />
      <stop offset="100%" stop-color="#041f38" />
    </linearGradient>

    <linearGradient id="body-surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a3f" />
      <stop offset="50%" stop-color="#123b55" />
      <stop offset="100%" stop-color="#082234" />
    </linearGradient>

    <linearGradient id="body-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d82a4" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1e5473" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0b2c40" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a2838" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e394f" stop-opacity="0.9" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#163e54" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo do Canvas -->
  <rect width="800" height="1000" fill="url(#base-bg)" />
  <rect width="800" height="1000" fill="url(#grid-pattern)" />

  <!-- Eixo gravitacional central de referência postural -->
  <line x1="400" y1="50" x2="400" y2="950" stroke="#255874" stroke-width="1.2" stroke-dasharray="6 4" stroke-opacity="0.6" />

  <!-- Linhas horizontais de referência biomecânica -->
  <!-- Linha dos Ombros -->
  <line x1="180" y1="260" x2="620" y2="260" stroke="#1f4b63" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <text x="630" y="264" fill="#588ea8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">OMBRO</text>

  <!-- Linha do Pélvis -->
  <line x1="200" y1="530" x2="600" y2="530" stroke="#1f4b63" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <text x="610" y="534" fill="#588ea8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">QUADRIL</text>

  <!-- Linha dos Joelhos -->
  <line x1="240" y1="730" x2="560" y2="730" stroke="#1f4b63" stroke-width="1" stroke-dasharray="3 3" stroke-opacity="0.5" />
  <text x="570" y="734" fill="#588ea8" font-family="system-ui, sans-serif" font-size="11" letter-spacing="1">JOELHOS</text>

  <!-- Brilho de silhueta corporal -->
  <g filter="url(#soft-glow)" opacity="0.4">
    <!-- Cabeça e pescoço -->
    <ellipse cx="400" cy="135" rx="58" ry="72" fill="#1b4d6d" />
    <path d="M 370 200 L 430 200 L 440 240 L 360 240 Z" fill="#1b4d6d" />
    <!-- Tronco e membros -->
    <path d="M 270 260 C 240 310, 220 380, 220 540 C 220 600, 240 600, 245 550 L 255 450 L 320 530 L 335 730 L 345 920 L 380 920 L 385 750 L 395 560 L 405 560 L 415 750 L 420 920 L 455 920 L 465 730 L 480 530 L 545 450 L 555 550 C 560 600, 580 600, 580 540 C 580 380, 560 310, 530 260 Z" fill="#1b4d6d" />
  </g>

  <!-- Silhueta Corporal Principal (Camada 1: Superfície / Postura) -->
  <g id="body-surface-layer">
    <!-- Cabeça e Crânio Externo -->
    <ellipse cx="400" cy="135" rx="55" ry="70" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />
    <!-- Contorno Facial e Mandíbula -->
    <path d="M 360 140 C 360 185, 380 200, 400 202 C 420 200, 440 185, 440 140" fill="none" stroke="#3d82a4" stroke-width="1.5" stroke-opacity="0.7" />

    <!-- Pescoço / Trapézio Superior -->
    <path d="M 368 195 C 365 220, 345 240, 280 265 L 520 265 C 455 240, 435 220, 432 195 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="1.8" />

    <!-- Tronco Principal (Tórax, Abdômen e Quadril) -->
    <path d="M 280 265 C 265 290, 260 330, 275 390 C 285 430, 310 470, 325 520 C 335 550, 330 570, 330 580 L 470 580 C 470 570, 465 550, 475 520 C 490 470, 515 430, 525 390 C 540 330, 535 290, 520 265 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />

    <!-- Músculos Peitorais e Caixa Torácica (Superfície) -->
    <path d="M 400 250 L 400 375" stroke="#3d82a4" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 340 320 C 365 345, 395 345, 400 345 C 405 345, 435 345, 460 320" fill="none" stroke="#3d82a4" stroke-width="1.8" stroke-opacity="0.8" />
    <path d="M 330 330 C 360 365, 395 365, 400 365 C 405 365, 440 365, 470 330" fill="none" stroke="#255a77" stroke-width="1.4" stroke-opacity="0.6" />

    <!-- Linha Alba e Gominhos Abdominais (Linhas de Superfície) -->
    <line x1="400" y1="375" x2="400" y2="520" stroke="#2c698c" stroke-width="1.6" stroke-opacity="0.7" />
    <path d="M 365 410 C 385 415, 415 415, 435 410" fill="none" stroke="#21526f" stroke-width="1.4" />
    <path d="M 368 450 C 385 455, 415 455, 432 450" fill="none" stroke="#21526f" stroke-width="1.4" />
    <path d="M 372 490 C 385 494, 415 494, 428 490" fill="none" stroke="#21526f" stroke-width="1.4" />

    <!-- Braço Esquerdo (Anatômico Direito / Tela Esquerda) -->
    <path d="M 280 265 C 255 285, 235 330, 230 380 C 225 430, 220 480, 215 540 C 212 570, 215 610, 222 630 C 228 635, 238 635, 242 625 C 248 595, 252 540, 258 480 C 265 425, 275 390, 275 390 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />
    <!-- Braço Direito (Anatômico Esquerdo / Tela Direita) -->
    <path d="M 520 265 C 545 285, 565 330, 570 380 C 575 430, 580 480, 585 540 C 588 570, 585 610, 578 630 C 572 635, 562 635, 558 625 C 552 595, 548 540, 542 480 C 535 425, 525 390, 525 390 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />

    <!-- Perna Esquerda (Anatômico) -->
    <path d="M 330 575 C 320 625, 320 685, 330 730 C 335 755, 335 780, 338 830 C 340 880, 342 920, 345 940 C 347 948, 380 948, 382 940 C 385 915, 388 860, 388 810 C 388 760, 382 725, 380 690 C 378 640, 385 600, 395 570 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />

    <!-- Perna Direita (Anatômico) -->
    <path d="M 470 575 C 480 625, 480 685, 470 730 C 465 755, 465 780, 462 830 C 460 880, 458 920, 455 940 C 453 948, 420 948, 418 940 C 415 915, 412 860, 412 810 C 412 760, 418 725, 420 690 C 422 640, 415 600, 405 570 Z" fill="url(#body-surface)" stroke="#2b6b8f" stroke-width="2" />

    <!-- Destaques Musculares de Quadríceps e Joelhos -->
    <ellipse cx="355" cy="730" rx="14" ry="16" fill="none" stroke="#3d82a4" stroke-width="1.5" stroke-opacity="0.8" />
    <ellipse cx="445" cy="730" rx="14" ry="16" fill="none" stroke="#3d82a4" stroke-width="1.5" stroke-opacity="0.8" />
    <path d="M 345 640 C 350 670, 360 690, 355 710" fill="none" stroke="#255a77" stroke-width="1.5" />
    <path d="M 455 640 C 450 670, 440 690, 445 710" fill="none" stroke="#255a77" stroke-width="1.5" />
  </g>

  <!-- Pontos de Marcação Postural (Landmarks) -->
  <g id="postural-markers" fill="#52a0c4" stroke="#ffffff" stroke-width="1.5">
    <circle cx="280" cy="265" r="4.5" />
    <circle cx="520" cy="265" r="4.5" />
    <circle cx="330" cy="530" r="4.5" />
    <circle cx="470" cy="530" r="4.5" />
    <circle cx="355" cy="730" r="4.5" />
    <circle cx="445" cy="730" r="4.5" />
    <circle cx="362" cy="935" r="4" />
    <circle cx="438" cy="935" r="4" />
  </g>

  <!-- Selos de Identificação e Orientação -->
  <!-- Header Card Superior -->
  <g transform="translate(40, 35)">
    <rect width="720" height="42" rx="10" fill="url(#badge-bg)" stroke="#1e4e68" stroke-width="1" />
    <circle cx="24" cy="21" r="5" fill="#4fa3cb" />
    <text x="40" y="26" fill="#c3e4f5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      MÉTODO LR · CAMADA 1: POSTURA &amp; SUPERFÍCIE CORPORAL
    </text>
    <text x="690" y="26" text-anchor="end" fill="#69a3bf" font-family="system-ui, sans-serif" font-size="11">
      BASE PLACEHOLDER
    </text>
  </g>

  <!-- Badge Inferior Informativo -->
  <g transform="translate(180, 955)">
    <rect width="440" height="30" rx="8" fill="#041525" stroke="#1d4860" stroke-width="1" opacity="0.9" />
    <text x="220" y="20" text-anchor="middle" fill="#75b2cf" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">
      IMAGEM ORIGINAL TEMPORÁRIA · PASSE O MOUSE OU TOQUE PARA REVELAR O RAIO-X
    </text>
  </g>
</svg>